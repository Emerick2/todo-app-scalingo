name: Deploy to Staging

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Scalingo CLI
        run: |
          curl -s https://cli-dl.scalingo.com/install | bash
          
      - name: Deploy to Scalingo Staging
        env:
          SCALINGO_API_TOKEN: ${{ secrets.SCALINGO_API_TOKEN }}
        run: |
          scalingo login --api-token $SCALINGO_API_TOKEN
          scalingo --app ${{ secrets.SCALINGO_STAGING_APP }} git-setup --remote scalingo-staging
          git push scalingo-staging main:master